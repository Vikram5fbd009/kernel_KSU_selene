name: Build Kernel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        grep -v -E "^#|^\n" config.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV

    - name: Remove unused packages
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap to 6G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 6

    - name: Setup kernel build environment
      run: |
        echo "BUILD_TIME=$(TZ=UTC date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen minicom bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 binutils-aarch64-linux-gnu
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    # ==========================================================
    # 🔽 CLANG download — condition fix किया ताकि GCC के साथ भी चले
    # ==========================================================
    - name: Download AOSP Clang
      if: env.USE_CUSTOM_CLANG != 'true' && env.USE_CUSTOM_GCC != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang
        wget -nv https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz -O clang.tar.gz
        tar -C clang/ -zxvf clang.tar.gz
        rm -f clang.tar.gz
        ls clang/bin/clang && echo "✅ Clang downloaded"

    - name: Download Custom Clang
      if: env.USE_CUSTOM_CLANG == 'true' && env.USE_CUSTOM_GCC != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O clang.tar.gz ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -zxvf clang.tar.gz
        elif [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O clang.tar.xz ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -Jxvf clang.tar.xz
        elif [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.CUSTOM_CLANG_SOURCE }} -b ${{ env.CUSTOM_CLANG_BRANCH }} clang --depth=1
        else
            wget -nv -O clang.zip ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            unzip clang.zip -d clang/
        fi
        if [[ "$(find ./clang -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
            mv -f "$(find ./clang -mindepth 1 -maxdepth 1 -type d)"/* ./clang
        fi

    - name: Download GCC AOSP
      if: env.ENABLE_GCC_AOSP == 'true' && env.USE_CUSTOM_GCC != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ "${{ env.ENABLE_GCC_ARM64 }}" = "true" ]; then
            mkdir -p gcc-64
            wget -nv -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
            tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
            rm -f gcc-aarch64.tar.gz
        fi
        if [ "${{ env.ENABLE_GCC_ARM32 }}" = "true" ]; then
            mkdir -p gcc-32
            wget -nv -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
            tar -C gcc-32/ -zxvf gcc-arm.tar.gz
            rm -f gcc-arm.tar.gz
        fi

    - name: Download Custom GCC
      if: env.USE_CUSTOM_GCC == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ "${{ env.USE_CUSTOM_GCC_64 }}" = "true" ]; then
            if [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-64.tar.gz ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir -p gcc-64
                tar -C gcc-64/ -zxvf gcc-64.tar.gz
            elif [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-64.xz ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir -p gcc-64
                tar -C gcc-64/ -Jxvf gcc-64.xz
            elif [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.CUSTOM_GCC_64_SOURCE }} -b ${{ env.CUSTOM_GCC_64_BRANCH }} gcc-64 --depth=1
            else
                wget -nv -O gcc-64.zip ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir -p gcc-64
                unzip gcc-64.zip -d gcc-64/
            fi
            if [[ "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-64
            fi
        fi
        if [ "${{ env.USE_CUSTOM_GCC_32 }}" = "true" ]; then
            if [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-32.tar.gz ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir -p gcc-32
                tar -C gcc-32/ -zxvf gcc-32.tar.gz
            elif [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-32.xz ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir -p gcc-32
                tar -C gcc-32/ -Jxvf gcc-32.xz
            elif [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.CUSTOM_GCC_32_SOURCE }} -b ${{ env.CUSTOM_GCC_32_BRANCH }} gcc-32 --depth=1
            else
                wget -nv -O gcc-32.zip ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir -p gcc-32
                unzip gcc-32.zip -d gcc-32/
            fi
            if [[ "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-32
            fi
        fi

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
        if [[ ${{ env.ADD_LOCALVERSION_TO_FILENAME }} == 'true' ]]; then
          echo "LOCALVERSION=$(cat android-kernel/localversion 2>/dev/null)" >> $GITHUB_ENV
        else
          echo "LOCALVERSION=" >> $GITHUB_ENV
        fi

    - name: Setup KernelSU (SukiSU-Ultra with built-in SUSFS)
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev
        if [ -d KernelSU ]; then
            KSU_VERSION="_$(cd KernelSU && expr $(/usr/bin/git rev-list --count HEAD) + 10200)"
        else
            KSU_VERSION=""
        fi
        echo "UPLOADNAME=-KernelSU$KSU_VERSION" >> $GITHUB_ENV

    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}"

        if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
            if [ "${{ env.KSU_HOOKS_PATCH }}" = "true" ] && [ -f "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" ]; then
                git apply "$GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch" || echo "⚠️ KSU_HOOKS_PATCH partial fail — continuing"
            fi

            if grep -q "CONFIG_KSU=" "$DEFCONFIG_PATH"; then
                sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/g' "$DEFCONFIG_PATH"
                sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' "$DEFCONFIG_PATH"
            else
                echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
            fi

            for config in \
                CONFIG_KSU=y \
                CONFIG_KSU_SUSFS=y \
                CONFIG_KSU_SUSFS_SUS_PATH=y \
                CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
                CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \
                CONFIG_KSU_SUSFS_SUS_KSTAT=y \
                CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
                CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y \
                CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
                CONFIG_KSU_SUSFS_ENABLE_LOG=y \
                CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
                CONFIG_KSU_SUSFS_SPOOF_PROC_CMDLINE=y \
                CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
                CONFIG_KALLSYMS=y \
                CONFIG_KALLSYMS_ALL=y
            do
                echo "$config" >> "$DEFCONFIG_PATH"
            done
        fi

        # Stack protector fix for Clang on 4.14
        sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/" "$DEFCONFIG_PATH"
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> "$DEFCONFIG_PATH"
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> "$DEFCONFIG_PATH"

        if [ "${{ env.ADD_OVERLAYFS_CONFIG }}" = "true" ]; then
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_OVERLAY_FS_INDEX=y" >> "$DEFCONFIG_PATH"
        fi

        if [ "${{ env.DISABLE_LTO }}" = "true" ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' "$DEFCONFIG_PATH"
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' "$DEFCONFIG_PATH"
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' "$DEFCONFIG_PATH"
            echo "CONFIG_LTO_NONE=y" >> "$DEFCONFIG_PATH"
        fi

        if [ "${{ env.DISABLE_CC_WERROR }}" = "true" ]; then
            echo "CONFIG_CC_WERROR=n" >> "$DEFCONFIG_PATH"
        fi

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Fix MTK drvgen for CI
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        [ -f scripts/drvgen/drvgen.mk ] && sed -i "s|rm -f \$@.tmp|rm -f \$@.tmp\n\ttouch \$@.tmp|" scripts/drvgen/drvgen.mk || true

    - name: Patch kernel for clang compatibility
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        DEFCONFIG_PATH="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"

        # Stack protector
        sed -i 's/ifdef CONFIG_CC_STACKPROTECTOR_REGULAR/ifdef DISABLED_SP_REGULAR/' Makefile
        sed -i 's/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/ifdef DISABLED_SP_STRONG/' Makefile
        sed -i '/^ifdef CONFIG_CC_STACKPROTECTOR$/s/.*/ifdef DISABLED_SP/' Makefile
        sed -i 's/ifdef stackp-name/ifdef DISABLED_STACKP_NAME/' Makefile
        sed -i 's/ifdef stackp-check/ifdef DISABLED_STACKP_CHECK/' Makefile
        echo "Stack protector checks disabled for clang compat"

        # Fix missing LCM panel Makefile
        find drivers/misc/mediatek/lcm -maxdepth 1 -type d 2>/dev/null | while read d; do
          if [ ! -f "$d/Makefile" ] && [ "$d" != "drivers/misc/mediatek/lcm" ]; then
            echo "obj-y +=" > "$d/Makefile"
            echo "Created missing Makefile: $d"
          fi
        done

        # Disable compat vDSO (avoid needing 32-bit cross-compiler)
        sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' "$DEFCONFIG_PATH" 2>/dev/null || true
        echo "# CONFIG_COMPAT_VDSO is not set" >> "$DEFCONFIG_PATH"

        # Patch arch Makefile to not error on missing CROSS_COMPILE_COMPAT
        [ -f arch/arm64/Makefile ] && sed -i 's/$(error CROSS_COMPILE_COMPAT not defined/$(warning CROSS_COMPILE_COMPAT not defined/' arch/arm64/Makefile
        [ -f arch/arm64/Makefile ] && sed -i 's/$(error $(CROSS_COMPILE_COMPAT)/$(warning $(CROSS_COMPILE_COMPAT)/' arch/arm64/Makefile

    # ==========================================================
    # 🔽 BUILD — यही है असली fix, अब Clang से बिल्ड होगी
    # ==========================================================
    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH"

        # Show toolchain versions
        clang --version | head -1
        aarch64-linux-android-gcc --version 2>/dev/null | head -1 || echo "GCC prefix not found"

        MAKE_ARGS="O=out ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-"

        # Defconfig
        make -j$(nproc --all) $MAKE_ARGS ${{ env.KERNEL_CONFIG }}

        # Full build
        make -j$(nproc --all) $MAKE_ARGS

    - name: Check a kernel output files
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ -f "android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}" ]; then
            echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
            echo "✅ Kernel image found"
        else
            echo "❌ Kernel output missing"
            ls -la android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/ 2>/dev/null || true
            exit 1
        fi
        if [ "${{ env.NEED_DTBO }}" = "true" ]; then
            if [ -f "android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img" ]; then
                echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
                echo "✅ dtbo.img found"
            else
                echo "⚠️ dtbo.img NOT found — continuing without it"
                echo "CHECK_DTBO_IS_OK=false" >> $GITHUB_ENV
            fi
        fi

    - name: Make Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_CUSTOM_ANYKERNEL3 != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ "${{ env.CHECK_DTBO_IS_OK }}" = "true" ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Zip AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd kernel_workspace/AnyKernel3
        zip -r ../AnyKernel3.zip . -x "*.git*"

    - name: Rename Artifacts for Release
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd kernel_workspace
        mv AnyKernel3.zip "AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}.zip"
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} "${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}"

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ env.BUILD_TIME }}
        name: Kernel Build ${{ env.BUILD_TIME }} - ${{ env.DEVICE }}
        draft: false
        prerelease: false
        files: |
          kernel_workspace/AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}.zip
          kernel_workspace/${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
